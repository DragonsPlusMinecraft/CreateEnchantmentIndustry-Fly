name: Publish to Maven

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build and publish to Maven
        run: ./gradlew clean build publish --no-daemon --stacktrace
        env:
          ORG_GRADLE_PROJECT_DragonsPlusUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_DragonsPlusPassword: ${{ secrets.MAVEN_PASSWORD }}
